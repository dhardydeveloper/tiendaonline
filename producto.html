<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Detalle del producto</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- MENÚ -->
    <header class="menu">
        <div class="logo">
            <a href="index.html">
                <img src="img/logo_perfume_sin_fondo.png"
                     alt="Logo de la Tienda">

            </a>

        </div>

        <nav class="nav">
            <a href="index.html">Inicio</a>
            <a href="nosotros.html">Quiénes Somos</a>
            <a href="productos.html">Productos</a>
            <a href="blogs.html">Blogs</a>
            <a href="contacto.html">Contacto</a>
            <a href="registro.html">Registro</a>
            <a href="login.html">Login</a>
        </nav>

    </header>


    <!-- PRODUCTO INDIVIDUAL -->

    <main class="detalle-producto">

        <!-- Imagen -->
        <div class="detalle-imagen">

            <img id="imagen-producto"
                 src=""
                 alt="">

        </div>


        <!-- Información -->
        <div class="detalle-info">

            <p id="marca-producto" class="detalle-marca"></p>

            <h1 id="nombre-producto"></h1>

            <p id="categoria-producto"
               class="detalle-categoria">
            </p>

            <div id="precio-producto"
                 class="detalle-precio">
            </div>

            <p id="descripcion-producto"
               class="detalle-descripcion">
            </p>


            <!-- Cantidad -->
            <div class="cantidad">

                <label for="cantidad">
                    Cantidad:
                </label>

                <input type="number"
                       id="cantidad"
                       value="1"
                       min="1">

            </div>


            <!-- Botón -->
            <button id="boton-carrito"
                    class="boton-carrito">

                Añadir al carrito

            </button>


            <!-- Volver -->
            <a href="productos.html"
               class="volver-productos">

                ← Volver a productos

            </a>

        </div>

    </main>


    <!-- JAVASCRIPT -->

    <script src="js/productos.js"></script>

    <script src="js/producto.js"></script>

</body>

</html>
