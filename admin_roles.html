<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Roles - AURA Perfumes</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #f4f6f9;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .admin-container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 30px;
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #c5a059;
      padding-bottom: 15px;
      margin-bottom: 25px;
    }

    .admin-header h2 {
      margin: 0;
      color: #111;
      font-size: 24px;
    }

    .admin-nav {
      display: flex;
      gap: 12px;
      margin-bottom: 30px;
    }

    .admin-nav a {
      text-decoration: none;
      padding: 10px 20px;
      background-color: #f8f9fa;
      color: #555;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .admin-nav a.active, .admin-nav a:hover {
      background-color: #111111;
      color: #c5a059;
      border-color: #111111;
    }

    .card-seccion {
      background: #fafafa;
      border: 1px solid #eaeaea;
      padding: 25px;
      border-radius: 8px;
      margin-bottom: 30px;
    }

    .card-seccion h3 {
      margin-top: 0;
      margin-bottom: 20px;
      color: #222;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-admin-rol {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 600;
      color: #555;
    }

    .form-admin-rol input, .form-admin-rol select {
      padding: 11px 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      background-color: #fff;
    }

    .form-admin-rol input:focus, .form-admin-rol select:focus {
      border-color: #c5a059;
    }

    .btn-guardar {
      grid-column: 1 / -1;
      background-color: #c5a059;
      color: #ffffff;
      border: none;
      padding: 13px;
      font-weight: bold;
      font-size: 15px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s;
      margin-top: 5px;
    }

    .btn-guardar:hover {
      background-color: #a38241;
    }

    .tabla-roles {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      margin-top: 10px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #eaeaea;
    }

    .tabla-roles th, .tabla-roles td {
      padding: 14px 16px;
      text-align: left;
      font-size: 14px;
    }

    .tabla-roles th {
      background-color: #111111;
      color: #ffffff;
      font-weight: 600;
    }

    .tabla-roles tr:nth-child(even) {
      background-color: #fcfcfc;
    }

    .tabla-roles tr:hover {
      background-color: #f5f5f5;
    }

    .tabla-roles td {
      border-bottom: 1px solid #eee;
      color: #333;
    }

    .badge-permiso {
      display: inline-block;
      padding: 4px 8px;
      background-color: #eef2f7;
      color: #334155;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      margin-right: 4px;
      margin-bottom: 2px;
    }

    .btn-accion {
      padding: 7px 14px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    .btn-accion:hover {
      opacity: 0.85;
    }

    .btn-editar { background-color: #f0ad4e; color: #fff; margin-right: 5px; }
    .btn-eliminar { background-color: #d9534f; color: #fff; }
  </style>
</head>

<body>

  <!-- MENÚ GENERAL -->
  <header class="menu">
    <div class="logo">
      <a href="index.html">
        <img src="img/logo_perfume_sin_fondo.png" alt="AURA Perfumes">
      </a>
    </div>
    <nav class="nav">
      <a href="index.html">Inicio</a>
      <a href="productos.html">Productos</a>
      <a href="admin.html">Panel Admin</a>
      <a href="#" id="btn-cerrar-sesion" style="color: #ff4d4d; font-weight: bold;">Cerrar Sesión</a>
    </nav>
  </header>

  <!-- CONTENIDO PANEL DE ADMINISTRACIÓN -->
  <main class="admin-container">
    <div class="admin-header">
      <h2>Panel de Control - Administrador</h2>
      <span style="color: #666; font-size: 14px;"><i class="fa-solid fa-circle-user"></i> Bienvenido, Admin</span>
    </div>

    <!-- Navegación entre pestañas del Administrador -->
    <div class="admin-nav">
      <a href="admin_productos.html"><i class="fa-solid fa-box"></i> Productos</a>
      <a href="admin_roles.html" class="active"><i class="fa-solid fa-shield-halved"></i> Roles</a>
      <a href="admin_usuarios.html"><i class="fa-solid fa-users"></i> Usuarios</a>
    </div>

    <!-- FORMULARIO CREAR / EDITAR ROL -->
    <div class="card-seccion">
      <h3 id="form-titulo"><i class="fa-solid fa-user-plus" style="color: #c5a059;"></i> Crear Nuevo Rol de Sistema</h3>
      <form class="form-admin-rol" id="formRol">
        <div class="form-group">
          <label for="rolNombre">Nombre del Rol</label>
          <input type="text" id="rolNombre" placeholder="Ej. Vendedor, Supervisor" required>
        </div>
        <div class="form-group">
          <label for="rolDescripcion">Descripción Breve</label>
          <input type="text" id="rolDescripcion" placeholder="Ej. Acceso a ventas e inventario" required>
        </div>
        <div class="form-group">
          <label for="rolPermisos">Nivel de Permisos</label>
          <select id="rolPermisos" required>
            <option value="total">Acceso Total</option>
            <option value="edicion">Gestión e Inventario</option>
            <option value="lectura">Solo Lectura</option>
          </select>
        </div>
        <button type="submit" class="btn-guardar" id="btnGuardarRol"><i class="fa-solid fa-plus-circle"></i> Crear Rol</button>
      </form>
    </div>

    <!-- TABLA CONFIGURACIÓN DE ROLES -->
    <div class="card-seccion" style="background: transparent; border: none; padding: 0;">
      <h3 style="margin-bottom: 15px;"><i class="fa-solid fa-user-shield" style="color: #c5a059;"></i> Configuración de Roles y Permisos</h3>
      <table class="tabla-roles">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre del Rol</th>
            <th>Descripción</th>
            <th>Permisos Asignados</th>
            <th style="text-align: center;">Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-roles-body">
          <!-- Los datos se generan dinámicamente mediante JS -->
        </tbody>
      </table>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 AURA Perfumes - Panel de Administración</p>
  </footer>

  <script>
    // Configuración inicial de roles por defecto
    const defaultRoles = [
      {
        id: 1,
        nombre: 'Administrador',
        descripcion: 'Acceso total al sistema y configuraciones.',
        permisoTipo: 'total',
        badges: ['Crear', 'Editar', 'Eliminar', 'Ver']
      },
      {
        id: 2,
        nombre: 'Cliente',
        descripcion: 'Acceso al catálogo y al carrito de compras.',
        permisoTipo: 'lectura',
        badges: ['Ver', 'Comprar']
      }
    ];

    let roles = JSON.parse(localStorage.getItem('aura_roles')) || defaultRoles;
    let rolEditandoId = null;

    document.addEventListener('DOMContentLoaded', () => {
      // 1. Verificación de Autenticación
      const userRole = localStorage.getItem('userRole');
      if (userRole !== 'admin') {
        alert('Acceso denegado. Debe iniciar sesión como Administrador.');
        window.location.href = 'login.html';
        return;
      }

      // 2. Evento Cerrar Sesión
      document.getElementById('btn-cerrar-sesion').addEventListener('click', (e) => {
        e.preventDefault();
        localStorage.removeItem('userRole');
        alert('Sesión cerrada correctamente.');
        window.location.href = 'login.html';
      });

      // 3. Renderizado inicial de la tabla
      renderizarTabla();

      // 4. Submit del formulario (Crear / Guardar Cambios)
      document.getElementById('formRol').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const nombre = document.getElementById('rolNombre').value.trim();
        const descripcion = document.getElementById('rolDescripcion').value.trim();
        const permisoTipo = document.getElementById('rolPermisos').value;

        // Generar badges de ejemplo según el permiso seleccionado
        let badges = [];
        if (permisoTipo === 'total') {
          badges = ['Crear', 'Editar', 'Eliminar', 'Ver'];
        } else if (permisoTipo === 'edicion') {
          badges = ['Crear', 'Editar', 'Ver'];
        } else {
          badges = ['Ver'];
        }

        if (rolEditandoId !== null) {
          // Modo Edición
          roles = roles.map(r => r.id === rolEditandoId ? { ...r, nombre, descripcion, permisoTipo, badges } : r);
          rolEditandoId = null;
          restablecerFormulario();
        } else {
          // Modo Creación
          const nuevoId = roles.length > 0 ? Math.max(...roles.map(r => r.id)) + 1 : 1;
          roles.push({ id: nuevoId, nombre, descripcion, permisoTipo, badges });
        }

        guardarEnStorage();
        renderizarTabla();
        this.reset();
      });
    });

    // Función para renderizar filas de la tabla
    function renderizarTabla() {
      const tbody = document.getElementById('tabla-roles-body');
      tbody.innerHTML = '';

      roles.forEach(rol => {
        const tr = document.createElement('tr');
        
        const badgesHTML = rol.badges.map(b => `<span class="badge-permiso">${b}</span>`).join(' ');

        tr.innerHTML = `
          <td>${rol.id}</td>
          <td><b>${rol.nombre}</b></td>
          <td>${rol.descripcion}</td>
          <td>${badgesHTML}</td>
          <td style="text-align: center;">
            <button class="btn-accion btn-editar" onclick="cargarEdicion(${rol.id})"><i class="fa-solid fa-pen-to-square"></i> Editar</button>
            <button class="btn-accion btn-eliminar" onclick="eliminarRol(${rol.id})"><i class="fa-solid fa-trash"></i> Eliminar</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Función para cargar datos al formulario para Editar
    function cargarEdicion(id) {
      const rol = roles.find(r => r.id === id);
      if (!rol) return;

      document.getElementById('rolNombre').value = rol.nombre;
      document.getElementById('rolDescripcion').value = rol.descripcion;
      document.getElementById('rolPermisos').value = rol.permisoTipo || 'total';

      rolEditandoId = id;

      document.getElementById('form-titulo').innerHTML = `<i class="fa-solid fa-pen-to-square" style="color: #c5a059;"></i> Modificar Rol ID #${id}`;
      document.getElementById('btnGuardarRol').innerHTML = `<i class="fa-solid fa-floppy-disk"></i> Guardar Cambios`;
    }

    // Función para Eliminar un Rol
    function eliminarRol(id) {
      if (confirm(`¿Estás seguro de que deseas eliminar el rol con ID ${id}?`)) {
        roles = roles.filter(r => r.id !== id);
        guardarEnStorage();
        renderizarTabla();
        if (rolEditandoId === id) restablecerFormulario();
      }
    }

    // Guardar cambios en LocalStorage
    function guardarEnStorage() {
      localStorage.setItem('aura_roles', JSON.stringify(roles));
    }

    // Restaurar formulario a su estado original
    function restablecerFormulario() {
      document.getElementById('formRol').reset();
      rolEditandoId = null;
      document.getElementById('form-titulo').innerHTML = `<i class="fa-solid fa-user-plus" style="color: #c5a059;"></i> Crear Nuevo Rol de Sistema`;
      document.getElementById('btnGuardarRol').innerHTML = `<i class="fa-solid fa-plus-circle"></i> Crear Rol`;
    }
  </script>

</body>

</html>
