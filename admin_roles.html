<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Roles - AURA Perfumes</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #f4f6f9;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .admin-container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 30px;
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #c5a059;
      padding-bottom: 15px;
      margin-bottom: 25px;
    }

    .admin-header h2 {
      margin: 0;
      color: #111;
      font-size: 24px;
    }

    .admin-nav {
      display: flex;
      gap: 12px;
      margin-bottom: 30px;
    }

    .admin-nav a {
      text-decoration: none;
      padding: 10px 20px;
      background-color: #f8f9fa;
      color: #555;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .admin-nav a.active, .admin-nav a:hover {
      background-color: #111111;
      color: #c5a059;
      border-color: #111111;
    }

    .card-seccion {
      background: #fafafa;
      border: 1px solid #eaeaea;
      padding: 25px;
      border-radius: 8px;
      margin-bottom: 30px;
    }

    .card-seccion h3 {
      margin-top: 0;
      margin-bottom: 20px;
      color: #222;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-admin-rol {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 600;
      color: #555;
    }

    .form-admin-rol input, .form-admin-rol select {
      padding: 11px 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      background-color: #fff;
    }

    .form-admin-rol input:focus, .form-admin-rol select:focus {
      border-color: #c5a059;
    }

    .btn-guardar {
      grid-column: 1 / -1;
      background-color: #c5a059;
      color: #ffffff;
      border: none;
      padding: 13px;
      font-weight: bold;
      font-size: 15px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s;
      margin-top: 5px;
    }

    .btn-guardar:hover {
      background-color: #a38241;
    }

    .btn-cancelar {
      grid-column: 1 / -1;
      background-color: #6c757d;
      color: #ffffff;
      border: none;
      padding: 10px;
      font-weight: bold;
      font-size: 14px;
      border-radius: 6px;
      cursor: pointer;
      display: none;
    }

    .tabla-roles {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      margin-top: 10px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #eaeaea;
    }

    .tabla-roles th, .tabla-roles td {
      padding: 14px 16px;
      text-align: left;
      font-size: 14px;
    }

    .tabla-roles th {
      background-color: #111111;
      color: #ffffff;
      font-weight: 600;
    }

    .tabla-roles tr:nth-child(even) {
      background-color: #fcfcfc;
    }

    .tabla-roles tr:hover {
      background-color: #f5f5f5;
    }

    .tabla-roles td {
      border-bottom: 1px solid #eee;
      color: #333;
    }

    .badge-permiso {
      display: inline-block;
      padding: 4px 8px;
      background-color: #eef2f7;
      color: #334155;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      margin-right: 4px;
      margin-bottom: 2px;
    }

    .btn-accion {
      padding: 7px 14px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    .btn-accion:hover {
      opacity: 0.85;
    }

    .btn-editar { background-color: #f0ad4e; color: #fff; margin-right: 5px; }
    .btn-eliminar { background-color: #d9534f; color: #fff; }
  </style>
</head>

<body>

  <!-- MENÚ GENERAL -->
  <header class="menu">
    <div class="logo">
      <a href="index.html">
        <img src="img/logo_perfume_sin_fondo.png" alt="AURA Perfumes">
      </a>
    </div>
    <nav class="nav">
      <a href="index.html">Inicio</a>
      <a href="productos.html">Productos</a>
      <a href="admin.html">Panel Admin</a>
      <a href="#" id="btn-cerrar-sesion" style="color: #ff4d4d; font-weight: bold;">Cerrar Sesión</a>
    </nav>
  </header>

  <!-- CONTENIDO PANEL DE ADMINISTRACIÓN -->
  <main class="admin-container">
    <div class="admin-header">
      <h2>Panel de Control - Administrador</h2>
      <span style="color: #666; font-size: 14px;"><i class="fa-solid fa-circle-user"></i> Bienvenido, Admin</span>
    </div>

    <!-- Navegación entre pestañas del Administrador -->
    <div class="admin-nav">
      <a href="admin_productos.html"><i class="fa-solid fa-box"></i> Productos</a>
      <a href="admin_roles.html" class="active"><i class="fa-solid fa-shield-halved"></i> Roles</a>
      <a href="admin_usuarios.html"><i class="fa-solid fa-users"></i> Usuarios</a>
    </div>

    <!-- FORMULARIO CREAR ROL -->
    <div class="card-seccion">
      <h3 id="formTitulo"><i class="fa-solid fa-user-plus" style="color: #c5a059;"></i> Crear Nuevo Rol de Sistema</h3>
      <form class="form-admin-rol" id="formRol">
        <!-- Campo oculto para almacenar el ID cuando se edita -->
        <input type="hidden" id="rolId">

        <div class="form-group">
          <label>Nombre del Rol</label>
          <input type="text" id="nombreRol" placeholder="Ej. Vendedor, Supervisor" required>
        </div>
        <div class="form-group">
          <label>Descripción Breve</label>
          <input type="text" id="descripcionRol" placeholder="Ej. Acceso a ventas e inventario" required>
        </div>
        <div class="form-group">
          <label>Nivel de Permisos</label>
          <select id="nivelPermisos" required>
            <option value="total">Acceso Total</option>
            <option value="edicion">Gestión e Inventario</option>
            <option value="lectura">Solo Lectura</option>
          </select>
        </div>
        <button type="submit" class="btn-guardar" id="btnGuardar"><i class="fa-solid fa-plus-circle"></i> Crear Rol</button>
        <button type="button" class="btn-cancelar" id="btnCancelar">Cancelar Edición</button>
      </form>
    </div>

    <!-- TABLA CONFIGURACIÓN DE ROLES -->
    <div class="card-seccion" style="background: transparent; border: none; padding: 0;">
      <h3 style="margin-bottom: 15px;"><i class="fa-solid fa-user-shield" style="color: #c5a059;"></i> Configuración de Roles y Permisos</h3>
      <table class="tabla-roles">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre del Rol</th>
            <th>Descripción</th>
            <th>Permisos Asignados</th>
            <th style="text-align: center;">Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaRolesBody">
          <!-- Carga dinámicamente desde JS / localStorage -->
        </tbody>
      </table>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 AURA Perfumes - Panel de Administración</p>
  </footer>

  <script>
    // Se ejecuta al completarse la carga de la estructura HTML
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Control de acceso
      // Recupera el rol de usuario almacenado en localStorage
      const userRole = localStorage.getItem('userRole');
      // Verifica si el usuario actual NO es administrador
      if (userRole !== 'admin') {
        // Muestra alerta informando la restricción
        alert('Acceso denegado. Debe iniciar sesión como Administrador.');
        // Redirige al inicio de sesión
        window.location.href = 'login.html';
        // Interrumpe la ejecución del código JS
        return;
      }

      // Asigna evento de clic para el botón de cerrar sesión
      document.getElementById('btn-cerrar-sesion').addEventListener('click', (e) => {
        // Cancela la navegación predeterminada del enlace
        e.preventDefault();
        // Borra los datos almacenados en localStorage
        localStorage.clear();
        // Muestra notificación de confirmación
        alert('Sesión cerrada correctamente.');
        // Redirecciona al usuario al login
        window.location.href = 'login.html';
      });

      // 2. Datos iniciales por defecto (si localStorage está vacío)
      // Arreglo con la configuración inicial de roles por defecto
      const rolesIniciales = [
        { 
          id: 1, 
          nombre: 'Administrador', 
          descripcion: 'Acceso total al sistema y configuraciones.', 
          nivel: 'total',
          permisos: ['Crear', 'Editar', 'Eliminar', 'Ver'] 
        },
        { 
          id: 2, 
          nombre: 'Cliente', 
          descripcion: 'Acceso al catálogo y al carrito de compras.', 
          nivel: 'lectura',
          permisos: ['Ver', 'Comprar'] 
        }
      ];

      // Función para obtener la lista de roles
      function obtenerRoles() {
        // Consulta los roles en localStorage
        const guardados = localStorage.getItem('roles');
        // Si no existen roles guardados aún
        if (!guardados) {
          // Asigna e inicializa en localStorage los roles iniciales convertidos a JSON
          localStorage.setItem('roles', JSON.stringify(rolesIniciales));
          // Retorna los roles base
          return rolesIniciales;
        }
        // Convierte el JSON string recuperado en un objeto/arreglo JS
        return JSON.parse(guardados);
      }

      // Función para guardar el estado actual de los roles en localStorage
      function guardarRoles(roles) {
        // Almacena el arreglo formateado como string JSON
        localStorage.setItem('roles', JSON.stringify(roles));
      }

      // Elementos del DOM
      // Referencia del formulario de roles
      const form = document.getElementById('formRol');
      // Referencia del input oculto de ID
      const rolIdInput = document.getElementById('rolId');
      // Referencia del input de nombre del rol
      const nombreInput = document.getElementById('nombreRol');
      // Referencia del input de descripción
      const descripcionInput = document.getElementById('descripcionRol');
      // Referencia del selector de niveles
      const nivelSelect = document.getElementById('nivelPermisos');
      // Referencia del cuerpo de la tabla de roles
      const tablaBody = document.getElementById('tablaRolesBody');
      // Referencia del botón guardar
      const btnGuardar = document.getElementById('btnGuardar');
      // Referencia del botón cancelar
      const btnCancelar = document.getElementById('btnCancelar');
      // Referencia del título dinámico del formulario
      const formTitulo = document.getElementById('formTitulo');

      // Mapea el select de niveles a etiquetas de permisos visibles
      // Recibe la clave del nivel y retorna un arreglo con las acciones permitidas
      function obtenerBadgesPermisos(nivel) {
        // Retorna permisos completos para nivel total
        if (nivel === 'total') return ['Crear', 'Editar', 'Eliminar', 'Ver'];
        // Retorna permisos intermedios para gestión
        if (nivel === 'edicion') return ['Ver', 'Crear', 'Editar'];
        // Retorna permisos básicos para solo lectura
        return ['Ver', 'Comprar'];
      }

      // Renderiza los roles en la tabla
      // Función que genera dinámicamente las filas HTML de los roles
      function renderizarTabla() {
        // Obtiene el conjunto actual de roles
        const roles = obtenerRoles();
        // Vacía la tabla antes de renderizar
        tablaBody.innerHTML = '';

        // Comprueba si no hay registros
        if (roles.length === 0) {
          // Imprime fila avisando la falta de roles registrados
          tablaBody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No hay roles registrados.</td></tr>';
          // Detiene el proceso de renderizado
          return;
        }

        // Recorre iterativamente cada objeto de rol
        roles.forEach(rol => {
          // Crea un elemento HTML tr (fila)
          const tr = document.createElement('tr');
          // Genera el conjunto de etiquetas tipo badge para mostrar los permisos asignados
          const badgesHTML = rol.permisos.map(p => `<span class="badge-permiso">${p}</span>`).join(' ');

          // Asigna la estructura e información a las celdas de la fila
          tr.innerHTML = `
            <td>${rol.id}</td>
            <td><b>${rol.nombre}</b></td>
            <td>${rol.descripcion}</td>
            <td>${badgesHTML}</td>
            <td style="text-align: center;">
              <button class="btn-accion btn-editar" onclick="prepararEdicion(${rol.id})"><i class="fa-solid fa-pen-to-square"></i> Editar</button>
              <button class="btn-accion btn-eliminar" onclick="eliminarRol(${rol.id})"><i class="fa-solid fa-trash"></i> Eliminar</button>
            </td>
          `;
          // Inserta la fila dentro de la tabla
          tablaBody.appendChild(tr);
        });
      }

      // Guardar o Actualizar Rol
      // Escucha la acción de enviar el formulario
      form.addEventListener('submit', (e) => {
        // Evita el envío tradicional y recarga de página
        e.preventDefault();
        // Carga los roles existentes
        let roles = obtenerRoles();
        // Extrae el ID del campo oculto
        const id = rolIdInput.value;
        // Obtiene y limpia el texto del nombre
        const nombre = nombreInput.value.trim();
        // Obtiene y limpia el texto de la descripción
        const descripcion = descripcionInput.value.trim();
        // Recupera el valor seleccionado en el nivel de permisos
        const nivel = nivelSelect.value;
        // Obtiene el array de permisos en base al nivel elegido
        const permisos = obtenerBadgesPermisos(nivel);

        // Evalúa si el formulario contiene un ID existente (Edición)
        if (id) {
          // Edición
          // Actualiza las propiedades del rol coincidente
          roles = roles.map(r => r.id == id ? { id: Number(id), nombre, descripcion, nivel, permisos } : r);
          // Alerta al usuario sobre la actualización
          alert('Rol actualizado exitosamente');
        } else {
          // Creación de nuevo rol
          // Determina el id correlativo consultando el valor máximo o inicializa en 1
          const nuevoId = roles.length > 0 ? Math.max(...roles.map(r => r.id)) + 1 : 1;
          // Añade el objeto nuevo al array de roles
          roles.push({ id: nuevoId, nombre, descripcion, nivel, permisos });
          // Muestra mensaje de confirmación
          alert('Rol creado exitosamente');
        }

        // Guarda el estado en localStorage
        guardarRoles(roles);
        // Resetea el formulario al estado por defecto
        limpiarFormulario();
        // Reconstruye la vista de la tabla
        renderizarTabla();
      });

      // Cargar datos en el formulario para editar
      // Define la función global para preparar el formulario con la información del rol seleccionado
      window.prepararEdicion = function(id) {
        // Obtiene los roles almacenados
        const roles = obtenerRoles();
        // Busca el rol correspondiente mediante su id
        const rol = roles.find(r => r.id === id);
        // Si el rol es encontrado
        if (rol) {
          // Coloca el ID en el campo oculto
          rolIdInput.value = rol.id;
          // Asigna el nombre al input
          nombreInput.value = rol.nombre;
          // Asigna la descripción al input
          descripcionInput.value = rol.descripcion;
          // Asigna la opción de nivel o establece 'lectura' si no cuenta con uno
          nivelSelect.value = rol.nivel || 'lectura';

          // Cambia el título del formulario a modo edición
          formTitulo.innerHTML = '<i class="fa-solid fa-pen-to-square" style="color: #c5a059;"></i> Editar Rol de Sistema';
          // Modifica el texto del botón principal
          btnGuardar.innerHTML = '<i class="fa-solid fa-rotate"></i> Actualizar Rol';
          // Hace visible el botón de cancelar
          btnCancelar.style.display = 'block';
        }
      };

      // Eliminar Rol
      // Define la función global para borrar registros por su ID
      window.eliminarRol = function(id) {
        // Muestra cuadro de diálogo pidiendo confirmación
        if (confirm('¿Estás seguro de eliminar este rol?')) {
          // Obtiene los roles guardados
          let roles = obtenerRoles();
          // Excluye el rol que coincida con el ID enviado
          roles = roles.filter(r => r.id !== id);
          // Sobrescribe los roles en el almacenamiento local
          guardarRoles(roles);
          // Vuelve a pintar la tabla
          renderizarTabla();
        }
      };

      // Resetear el formulario
      // Vincula la función de limpieza al botón cancelar
      btnCancelar.addEventListener('click', limpiarFormulario);

      // Función encarga de restablecer todos los controles del formulario
      function limpiarFormulario() {
        // Borra las entradas de los campos
        form.reset();
        // Vacía el input oculto de ID
        rolIdInput.value = '';
        // Restaura el título original del formulario
        formTitulo.innerHTML = '<i class="fa-solid fa-user-plus" style="color: #c5a059;"></i> Crear Nuevo Rol de Sistema';
        // Restaura el botón a su acción inicial
        btnGuardar.innerHTML = '<i class="fa-solid fa-plus-circle"></i> Crear Rol';
        // Oculta el botón de cancelar edición
        btnCancelar.style.display = 'none';
      }

      // Carga inicial de datos
      // Llama a la función para cargar la tabla al abrir el sitio
      renderizarTabla();
    });
  </script>

</body>

</html>
