  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

      <div class="banner-js">
        <span id="mensaje">💳 Paga en hasta 6 cuotas sin interés — 🛍️ Retira gratis en tienda — 🚚 Envío gratis sobre $50.000</span>
    </div>

  <header class="menu">
    <div class="logo">
      <a href="index.html"><img src="img/logo_perfume_sin_fondo.png" alt="Logo"></a>
    </div>
    <nav class="nav">
      <a href="index.html">Inicio</a>
      <a href="nosotros.html">Quiénes Somos</a>
      <a href="productos.html">Productos</a>

      <span id="menu-usuario">
        <a href="registro.html">Registro</a>
        <a href="login.html">Login</a>
      </span>
    </nav>
  </header>

  <main>
    <!-- Banner superior -->
    <section class="banner-contacto">
      <div class="banner-texto">
        <h1>Contáctanos</h1>
        <p>Queremos escucharte</p>
      </div>
    </section>

    <!-- Formulario -->
    <section class="contacto-container">
      <form id="formContacto" class="contacto-form">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre" required>
        
        <label for="correo">Correo:</label>
        <input type="email" id="correo" name="correo" placeholder="Ingresa tu correo" required>
        
        <label for="mensaje">Mensaje:</label>
        <textarea id="mensaje" name="mensaje" maxlength="500" placeholder="Escribe tu mensaje..." required></textarea>
        
        <button type="submit">Enviar</button>
      </form>
    </section>
  </main>
<div id="respuesta-envio" style="margin-top: 15px; font-weight: bold; text-align: center;"></div>
  <footer>
    <p>&copy; 2026 AURA Perfumes - Todos los derechos reservados</p>
  </footer>
  <script src="js/menu-rol.js"></script>
  <script>
  document.getElementById('formContacto').addEventListener('submit', function(e) {
    e.preventDefault(); // Evita que la página se recargue

    // Aquí puedes agregar tu lógica de envío (fetch a un servidor, etc.)
    
    // Muestra el mensaje único
    const contenedorRespuesta = document.getElementById('respuesta-envio');
    contenedorRespuesta.style.color = 'green';
    contenedorRespuesta.textContent = '¡Gracias por contactarnos! Tu mensaje ha sido enviado con éxito.';

    // Opcional: Limpiar el formulario
    this.reset();
  });
</script>
  
</body>
</html>
