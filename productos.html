<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos - AURA Perfumes</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Menú -->
  <header class="menu">
    <div class="logo">
      <a href="index.html"><img src="img/logo_perfume_sin_fondo.png" alt="Logo"></a>
    </div>
    <nav class="nav">
      <a href="index.html">Inicio</a>
      <a href="nosotros.html">Quiénes Somos</a>
      <a href="productos.html">Productos</a>
      <a href="blogs.html">Blogs</a>
      <a href="contacto.html">Contacto</a>
      <a href="registro.html">Registro</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <!-- Catálogo -->
  <main>
    <h1>Nuestros Perfumes</h1>
    <div class="productos-grid">
      <div class="producto">
        <img src="img/perfume1.jpg" alt="Perfume 1">
        <h3>Perfume Elegancia</h3>
        <p>$25.000</p>
        <button onclick="agregarAlCarrito('Perfume Elegancia', 25000)">Añadir al carrito</button>
      </div>
      <div class="producto">
        <img src="img/perfume2.jpg" alt="Perfume 2">
        <h3>Perfume Romance</h3>
        <p>$30.000</p>
        <button onclick="agregarAlCarrito('Perfume Romance', 30000)">Añadir al carrito</button>
      </div>
      <div class="producto">
        <img src="img/perfume3.jpg" alt="Perfume 3">
        <h3>Perfume Frescura</h3>
        <p>$28.000</p>
        <button onclick="agregarAlCarrito('Perfume Frescura', 28000)">Añadir al carrito</button>
      </div>
    </div>

    <!-- Carrito -->
    <section class="carrito">
      <h2>🛒 Carrito de Compras</h2>
      <ul id="carrito"></ul>
      <p>Total: $<span id="total">0</span></p>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 AURA Perfumes - Todos los derechos reservados</p>
  </footer>

  <!-- Script JS -->
  <script src="js/script.js"></script>
</body>
</html>
