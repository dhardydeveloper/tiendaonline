<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Usuarios - AURA Perfumes</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Estilos para el fondo de pantalla y la letra de toda la página */
    body {
      background-color: #f4f6f9;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* La caja blanca principal donde vive todo el panel del administrador */
    .admin-container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 30px;
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    }

    /* La parte de arriba del panel con el título y la bienvenida */
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #c5a059;
      padding-bottom: 15px;
      margin-bottom: 25px;
    }

    .admin-header h2 {
      margin: 0;
      color: #111;
      font-size: 24px;
    }

    /* Los botones tipo pestañas para cambiar entre secciones */
    .admin-nav {
      display: flex;
      gap: 12px;
      margin-bottom: 30px;
    }

    .admin-nav a {
      text-decoration: none;
      padding: 10px 20px;
      background-color: #f8f9fa;
      color: #555;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Cuando la pestaña está seleccionada o pasas el ratón por encima, se pone negra con letras doradas */
    .admin-nav a.active, .admin-nav a:hover {
      background-color: #111111;
      color: #c5a059;
      border-color: #111111;
    }

    /* Estilos para las tarjetas/bloques grises del contenido */
    .card-seccion {
      background: #fafafa;
      border: 1px solid #eaeaea;
      padding: 25px;
      border-radius: 8px;
      margin-bottom: 30px;
    }

    .card-seccion h3 {
      margin-top: 0;
      margin-bottom: 20px;
      color: #222;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Organiza los campos del formulario en filas que se acomodan según la pantalla */
    .form-admin-usuario {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
    }

    /* Agrupa el texto indicador (label) junto con su casilla de texto */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 600;
      color: #555;
    }

    /* Estilo para los cuadros de texto y el menú desplegable */
    .form-admin-usuario input, .form-admin-usuario select {
      padding: 11px 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      background-color: #fff;
    }

    /* Cuando haces clic en una casilla para escribir, el borde cambia a dorado */
    .form-admin-usuario input:focus, .form-admin-usuario select:focus {
      border-color: #c5a059;
    }

    /* Botón dorado grande para guardar o crear */
    .btn-guardar {
      grid-column: 1 / -1; /* Ocupa todo el ancho del formulario */
      background-color: #c5a059;
      color: #ffffff;
      border: none;
      padding: 13px;
      font-weight: bold;
      font-size: 15px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s;
      margin-top: 5px;
    }

    .btn-guardar:hover {
      background-color: #a38241;
    }

    /* Estilos generales para que la tabla se vea limpia */
    .tabla-usuarios {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      margin-top: 10px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #eaeaea;
    }

    .tabla-usuarios th, .tabla-usuarios td {
      padding: 14px 16px;
      text-align: left;
      font-size: 14px;
    }

    .tabla-usuarios th {
      background-color: #111111;
      color: #ffffff;
      font-weight: 600;
    }

    .tabla-usuarios tr:nth-child(even) {
      background-color: #fcfcfc; /* Alterna un color ligeramente gris en filas pares */
    }

    .tabla-usuarios tr:hover {
      background-color: #f5f5f5; /* Se ilumina levemente al pasar el ratón */
    }

    .tabla-usuarios td {
      border-bottom: 1px solid #eee;
      color: #333;
    }

    /* Etiqueta negra con letras doradas para los Administradores */
    .badge-rol-admin {
      display: inline-block;
      padding: 4px 10px;
      background-color: #111;
      color: #c5a059;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    /* Etiqueta gris para los Clientes */
    .badge-rol-cliente {
      display: inline-block;
      padding: 4px 10px;
      background-color: #e2e8f0;
      color: #334155;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    /* Botones pequeños para Editar y Eliminar dentro de la tabla */
    .btn-accion {
      padding: 7px 14px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    .btn-accion:hover {
      opacity: 0.85;
    }

    .btn-editar { background-color: #f0ad4e; color: #fff; margin-right: 5px; } /* Naranja */
    .btn-eliminar { background-color: #d9534f; color: #fff; } /* Rojo */
  </style>
</head>

<body>

  <!-- Encabezado superior con el logo y el menú principal de la web -->
  <header class="menu">
    <div class="logo">
      <a href="index.html">
        <img src="img/logo_perfume_sin_fondo.png" alt="AURA Perfumes">
      </a>
    </div>
    <nav class="nav">
      <a href="index.html">Inicio</a>
      <a href="productos.html">Productos</a>
      <a href="admin.html">Panel Admin</a>
      <!-- Enlace para salir que se ve en color rojo -->
      <a href="#" id="btn-cerrar-sesion" style="color: #ff4d4d; font-weight: bold;">Cerrar Sesión</a>
    </nav>
  </header>

  <!-- Cuerpo principal de la página de administración -->
  <main class="admin-container">
    <div class="admin-header">
      <h2>Panel de Control - Administrador</h2>
      <span style="color: #666; font-size: 14px;"><i class="fa-solid fa-circle-user"></i> Bienvenido, Admin</span>
    </div>

    <!-- Pestañas para moverse entre las secciones del panel -->
    <div class="admin-nav">
      <a href="admin_productos.html"><i class="fa-solid fa-box"></i> Productos</a>
      <a href="admin_roles.html"><i class="fa-solid fa-shield-halved"></i> Roles</a>
      <a href="admin_usuarios.html" class="active"><i class="fa-solid fa-users"></i> Usuarios</a>
    </div>

    <!-- FORMULARIO: Sirve tanto para crear usuarios nuevos como para modificar existentes -->
    <div class="card-seccion">
      <h3 id="form-titulo"><i class="fa-solid fa-user-plus" style="color: #c5a059;"></i> Registrar Nuevo Usuario</h3>
      <form class="form-admin-usuario" id="formUsuario">
        <div class="form-group">
          <label for="inputNombre">Nombre Completo</label>
          <input type="text" id="inputNombre" placeholder="Ej. Alexandra Sujheil" required>
        </div>
        <div class="form-group">
          <label for="inputCorreo">Correo Electrónico</label>
          <input type="email" id="inputCorreo" placeholder="correo@ejemplo.com" required>
        </div>
        <div class="form-group">
          <label for="inputPassword">Contraseña</label>
          <input type="password" id="inputPassword" placeholder="••••••••">
        </div>
        <div class="form-group">
          <label for="selectRol">Rol de Usuario</label>
          <select id="selectRol" required>
            <option value="cliente">Cliente / Comprador</option>
            <option value="admin">Administrador</option>
          </select>
        </div>
        <button type="submit" class="btn-guardar" id="btnGuardar"><i class="fa-solid fa-user-check"></i> Crear Usuario</button>
      </form>
    </div>

    <!-- TABLA: Muestra la lista de las personas registradas -->
    <div class="card-seccion" style="background: transparent; border: none; padding: 0;">
      <h3 style="margin-bottom: 15px;"><i class="fa-solid fa-address-book" style="color: #c5a059;"></i> Lista de Usuarios Registrados</h3>
      <table class="tabla-usuarios">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Correo</th>
            <th>Rol</th>
            <th style="text-align: center;">Acciones</th>
          </tr>
        </thead>
        <!-- Aquí JavaScript insertará las filas de usuarios automáticamente -->
        <tbody id="tabla-body-usuarios">
          <!-- Se completa mediante JS -->
        </tbody>
      </table>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 AURA Perfumes - Panel de Administración</p>
  </footer>

  <script>
    // Usuarios iniciales de muestra por si es la primera vez que se abre la página
    const defaultUsuarios = [
      {
        id: 1,
        nombre: 'Administrador General',
        correo: 'admin@aura.com',
        password: 'adminpassword',
        rol: 'admin'
      },
      {
        id: 2,
        nombre: 'Cliente Prueba',
        correo: 'cliente@gmail.com',
        password: 'clientepassword',
        rol: 'cliente'
      }
    ];

    // Carga los usuarios guardados en la memoria del navegador. Si no hay nada, usa los de prueba de arriba
    let usuarios = JSON.parse(localStorage.getItem('aura_usuarios')) || defaultUsuarios;
    
    // Guarda el ID del usuario que estamos editando. Si vale null, significa que vamos a CREAR uno nuevo
    let usuarioEditandoId = null;

    // Todo este bloque se ejecuta automáticamente apenas la página termina de cargar
    document.addEventListener('DOMContentLoaded', () => {
      
      // 1. Revisa si quien entró tiene permiso de 'admin'. Si no es admin, lo saca al login
      const userRole = localStorage.getItem('userRole');
      if (userRole !== 'admin') {
        alert('Acceso denegado. Debe iniciar sesión como Administrador.');
        window.location.href = 'login.html';
        return;
      }

      // 2. Hace que el botón de "Cerrar Sesión" borre el permiso y te lleve a la pantalla de acceso
      document.getElementById('btn-cerrar-sesion').addEventListener('click', (e) => {
        e.preventDefault();
        localStorage.removeItem('userRole');
        alert('Sesión cerrada correctamente.');
        window.location.href = 'login.html';
      });

      // 3. Dibuja la lista de usuarios en la tabla apenas entras
      renderizarTabla();

      // 4. Qué pasa cuando presiona el botón del formulario (para Guardar o Crear)
      document.getElementById('formUsuario').addEventListener('submit', function(e) {
        e.preventDefault(); // Evita que la página se recargue sola

        // Toma los valores escritos en las casillas y quita espacios de más
        const nombre = document.getElementById('inputNombre').value.trim();
        const correo = document.getElementById('inputCorreo').value.trim();
        const password = document.getElementById('inputPassword').value.trim();
        const rol = document.getElementById('selectRol').value;

        if (usuarioEditandoId !== null) {
          // MODO EDITAR: Busca al usuario actual en la lista y cambia sus datos
          usuarios = usuarios.map(usr => {
            if (usr.id === usuarioEditandoId) {
              return {
                ...usr,
                nombre,
                correo,
                // Si dejaron la clave en blanco, mantiene la contraseña antigua
                password: password ? password : usr.password,
                rol
              };
            }
            return usr;
          });
          usuarioEditandoId = null; // Reinicia la variable para volver al modo "Crear"
          restablecerFormulario(); // Regresa los textos del formulario a su estado original
        } else {
          // MODO CREAR: Genera un ID nuevo (sumando 1 al ID más alto) y añade al nuevo usuario
          const nuevoId = usuarios.length > 0 ? Math.max(...usuarios.map(u => u.id)) + 1 : 1;
          usuarios.push({
            id: nuevoId,
            nombre,
            correo,
            password: password || '123456', // Si no pone clave, le asigna '123456' por defecto
            rol
          });
        }

        // Guarda en la memoria del navegador, redibuja la tabla y limpia los campos del formulario
        guardarEnStorage();
        renderizarTabla();
        this.reset();
      });
    });

    // Función que arma la tabla de usuarios fila por fila en la pantalla
    function renderizarTabla() {
      const tbody = document.getElementById('tabla-body-usuarios');
      tbody.innerHTML = ''; // Borra la tabla vieja para volver a dibujarla limpia

      usuarios.forEach(usr => {
        const tr = document.createElement('tr');

        // Determina si le pone la etiqueta de "Administrador" o de "Cliente"
        const isAdmin = usr.rol === 'admin';
        const badgeHTML = isAdmin
          ? `<span class="badge-rol-admin"><i class="fa-solid fa-user-shield"></i> Administrador</span>`
          : `<span class="badge-rol-cliente"><i class="fa-solid fa-user"></i> Cliente</span>`;

        // Crea el HTML con los datos del usuario y los botones de Editar/Eliminar
        tr.innerHTML = `
          <td>${usr.id}</td>
          <td><b>${usr.nombre}</b></td>
          <td>${usr.correo}</td>
          <td>${badgeHTML}</td>
          <td style="text-align: center;">
            <button class="btn-accion btn-editar" onclick="cargarEdicion(${usr.id})"><i class="fa-solid fa-pen-to-square"></i> Editar</button>
            <button class="btn-accion btn-eliminar" onclick="eliminarUsuario(${usr.id})"><i class="fa-solid fa-trash"></i> Eliminar</button>
          </td>
        `;
        tbody.appendChild(tr); // Agrega la fila armada a la tabla
      });
    }

    // Se ejecuta al hacer clic en el botón "Editar" de una fila: pasa los datos de esa persona al formulario
    function cargarEdicion(id) {
      const usr = usuarios.find(u => u.id === id);
      if (!usr) return;

      // Rellena los cuadros del formulario arriba con la información del usuario
      document.getElementById('inputNombre').value = usr.nombre;
      document.getElementById('inputCorreo').value = usr.correo;
      document.getElementById('inputPassword').value = '';
      document.getElementById('inputPassword').placeholder = 'Dejar en blanco para no cambiar';
      document.getElementById('selectRol').value = usr.rol;

      usuarioEditandoId = id; // Avisa al sistema qué usuario se está modificando

      // Cambia los textos del formulario para que sepamos que estamos en modo "Modificar"
      document.getElementById('form-titulo').innerHTML = `<i class="fa-solid fa-user-pen" style="color: #c5a059;"></i> Modificar Usuario ID #${id}`;
      document.getElementById('btnGuardar').innerHTML = `<i class="fa-solid fa-floppy-disk"></i> Guardar Cambios`;
    }

    // Se ejecuta al hacer clic en el botón "Eliminar"
    function eliminarUsuario(id) {
      // Pide confirmación al usuario
      if (confirm(`¿Estás seguro de que deseas eliminar al usuario con ID ${id}?`)) {
        usuarios = usuarios.filter(u => u.id !== id); // Quita a ese usuario de la lista
        guardarEnStorage();
        renderizarTabla();
        
        // Si justo estabas editando al usuario que acabas de borrar, limpia el formulario
        if (usuarioEditandoId === id) restablecerFormulario();
      }
    }

    // Guarda la lista completa de usuarios en la memoria del navegador (localStorage)
    function guardarEnStorage() {
      localStorage.setItem('aura_usuarios', JSON.stringify(usuarios));
    }

    // Devuelve el formulario de arriba a su estado normal (modo "Registrar Nuevo Usuario")
    function restablecerFormulario() {
      document.getElementById('formUsuario').reset();
      document.getElementById('inputPassword').placeholder = '••••••••';
      usuarioEditandoId = null;
      document.getElementById('form-titulo').innerHTML = `<i class="fa-solid fa-user-plus" style="color: #c5a059;"></i> Registrar Nuevo Usuario`;
      document.getElementById('btnGuardar').innerHTML = `<i class="fa-solid fa-user-check"></i> Crear Usuario`;
    }
  </script>

</body>

</html>
